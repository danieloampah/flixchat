name: flix_chat
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  auto_size_text: 3.0.0
  cached_network_image: 3.3.1
  flutter_animate: 4.5.0
  go_router: 12.1.3
  intl: 0.19.0
  page_transition: 2.1.0
  path_provider: 2.1.3
  shared_preferences: 2.2.2
  sqflite: 2.2.6
  timeago: 3.6.1
  cupertino_icons: ^1.0.0
  figma_squircle: ^0.6.3
  http: 1.2.1
  uuid: ^4.0.0
  flutter_svg: ^2.0.17
  google_sign_in: ^6.3.0
  fpdart: ^1.1.1
  data_connection_checker_nulls: ^0.0.2
  sign_in_with_apple: ^6.1.4

dev_dependencies:
  flutter_lints: 4.0.0
  lints: 4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/svg/

  fonts:
    - family: "JosefinSans"
      fonts:
        - asset: assets/fonts/JosefinSans-Regular.ttf
        - asset: assets/fonts/JosefinSans-Medium.ttf
        - asset: assets/fonts/JosefinSans-SemiBold.ttf
        - asset: assets/fonts/JosefinSans-Bold.ttf
